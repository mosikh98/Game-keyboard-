name: Build APK

# Builds the APK on every push to main, on pull requests and on demand.
# Pushes to main (and manual runs) also publish the APK in the repository's Releases section.
# Pushing a tag like v1.0.0 publishes a release with that tag name instead.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write # needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/GameKeyboard-${{ github.run_number }}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameKeyboard-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish APK in Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Game Keyboard build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
          make_latest: 'true'

      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: '*/build/reports'

  unit-tests:
    # quick check of the game mode text conversion; a failure here does not stop the APK or the release
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Find the unit test task
        id: find
        run: |
          ./gradlew :app:tasks --all > tasks.txt
          echo "unit test tasks that exist:"
          grep -i "unittest" tasks.txt || true
          for t in testRunTestsUnitTest testDebugUnitTest testDebugNoMinifyUnitTest testReleaseUnitTest; do
            if grep -q "^$t " tasks.txt; then
              echo "task=$t" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Run PersianVisualTest
        run: |
          if [ -z "${{ steps.find.outputs.task }}" ]; then
            echo "no unit test task found, see the list above"
            exit 1
          fi
          ./gradlew ":app:${{ steps.find.outputs.task }}" --tests "*PersianVisualTest*"

      - name: Archive reports for failed job
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '*/build/reports'
